<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Bop reminder</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html, body { height: 100%; overflow: hidden; }
      .reminder {
        height: 100%; display: flex; gap: 10px; padding: 12px 12px 12px 13px;
        border-radius: 14px; background: var(--surface);
        border: 1px solid color-mix(in srgb, var(--muted) 22%, transparent);
        box-shadow: 0 12px 28px rgba(20, 17, 32, 0.28);
        cursor: pointer;
      }
      .reminder:hover { border-color: color-mix(in srgb, var(--muted) 42%, transparent); }
      .reminder-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; }
      .reminder-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .reminder-kind { font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
      .reminder-title { font-weight: 700; font-size: 13px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .reminder-text {
        font-size: 12px; line-height: 1.35; color: color-mix(in srgb, var(--text) 78%, var(--muted));
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .reminder-foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
      .reminder-more { font-size: 11px; color: var(--muted); }
      .reminder-open {
        border: 0; border-radius: 999px; padding: 4px 12px; font: 700 11px/1.4 'Segoe UI', sans-serif;
        background: var(--brand); color: #fff; cursor: pointer;
      }
      .reminder-close {
        -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--muted);
        font: 700 14px/1 'Segoe UI', sans-serif; cursor: pointer; padding: 2px 4px; border-radius: 6px;
      }
      .reminder-close:hover { color: var(--text); background: color-mix(in srgb, var(--muted) 18%, transparent); }
    </style>
  </head>
  <body>
    <div class="reminder" id="card">
      <span class="reminder-dot" id="dot"></span>
      <div class="reminder-body">
        <span class="reminder-kind" id="kind">new alert</span>
        <span class="reminder-title" id="title"></span>
        <span class="reminder-text" id="text"></span>
        <div class="reminder-foot">
          <button class="reminder-open" id="open">Open</button>
          <span class="reminder-more" id="more"></span>
        </div>
      </div>
      <button class="reminder-close" id="close" title="Hide">×</button>
    </div>
    <script src="alert.js"></script>
  </body>
</html>
