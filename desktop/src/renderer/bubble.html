<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Bop bubble</title>
    <link rel="stylesheet" href="bubble.css" />
  </head>
  <body>
    <div class="bubble" id="bubble">
      <button class="core" id="core" title="Your spaces">
        <svg class="mark" id="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="11.4" cy="13" r="2.7"></circle>
          <circle cx="20.6" cy="13" r="2.7"></circle>
          <path d="M9.6 19.2c1.7 2.7 4.1 4 6.4 4s4.7-1.3 6.4-4"></path>
        </svg>
        <img class="picture" id="picture" alt="" hidden />
      </button>
      <span class="glow" aria-hidden="true"></span>
      <span class="badge" id="badge" hidden>0</span>
    </div>
    <script src="bubble.js"></script>
  </body>
</html>
