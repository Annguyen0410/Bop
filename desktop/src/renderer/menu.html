<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>Bop spaces</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Your spaces</span>
        <span class="panel-count" id="count">0</span>
      </div>
      <div class="panel-sub" id="subtitle">Bop keeps each one in its own session</div>
      <div class="panel-list" id="list"></div>
      <div class="panel-foot">
        <button class="primary" id="check">Check now</button>
        <button class="ghost" id="stop">Stop bubble</button>
      </div>
    </div>
    <script src="menu.js"></script>
  </body>
</html>
