name: CI

# The repository had no continuous integration at all: every verification in docs/ was a command a
# person had to remember to run. These are the two suites that must never regress, on the platforms
# they actually run on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (Node tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Every main and renderer file parses
        shell: bash
        run: |
          set -e
          for file in src/main/*.js src/renderer/*.js; do node --check "$file"; done
      - name: Unit and integration tests
        run: npm test

  android:
    name: Android (JVM tests and debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper is committed from a Windows checkout, where the executable bit is not tracked by
      # every tool. Without it `./gradlew` exits 126 in the first second and nothing is tested.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      # compileSdk 37 is newer than the platform the runner image normally ships. Install it when it is
      # missing instead of failing the build on a machine-specific SDK inventory.
      - name: Android SDK platform for compileSdk 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -d "$sdk_root/platforms/android-37" ] || [ -d "$sdk_root/platforms/android-37.0" ]; then
            echo "the compileSdk 37 platform is already installed"
            exit 0
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager is not on PATH; letting the Android Gradle plugin resolve compileSdk 37"
            exit 0
          fi
          # Platform packages are versioned by release (android-37.0 on this toolchain), so ask the
          # SDK which id exists instead of guessing one that would make this step fail.
          package="$(sdkmanager --list 2>/dev/null | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -uV | tail -1 || true)"
          if [ -z "$package" ]; then
            echo "this SDK image lists no android-37 package; the Gradle plugin will resolve it"
            exit 0
          fi
          printf 'y\n' | sdkmanager --install "$package" >/dev/null
      - name: JVM tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: Website (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      # The build also validates the output: one h1, real alt text, sized images, no external
      # subresources, no unresolved placeholders and no broken local reference.
      - name: Build and validate
        run: npm run build
      - name: Site tests
        run: npm test
