name: CI

# The repository had no continuous integration at all: every verification in docs/ was a command a
# person had to remember to run. These are the two suites that must never regress, on the platforms
# they actually run on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (Node tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Every main and renderer file parses
        shell: bash
        run: |
          set -e
          for file in src/main/*.js src/renderer/*.js; do node --check "$file"; done
      - name: Unit and integration tests
        run: npm test

  android:
    name: Android (JVM tests and debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Keep test and lint reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
